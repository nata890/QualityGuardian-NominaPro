name: Guardian Agent CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  guardia:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar conectividad OpenRouter
        run: python validar_conexion.py
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Generar test_engine.py
        run: python guardian_client.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Ejecutar tests Pytest
        run: python -m pytest test_engine.py -v --tb=short --junitxml=reporte_junit.xml

      - name: Generar veredicto.json
        run: python -c "
import json, glob, time, xml.etree.ElementTree as ET
try:
    tree = ET.parse('reporte_junit.xml')
    root = tree.getroot()
    testsuite = root[0] if len(root) > 0 else root
    total = int(testsuite.get('tests', 0))
    fallaron = int(testsuite.get('failures', 0)) + int(testsuite.get('errors', 0))
    pasaron = total - fallaron
    escenarios = []
    for tc in testsuite.findall('.//testcase'):
        tid = tc.get('name', 'unknown')
        failure = tc.find('failure')
        escenarios.append({
            'id': tid,
            'descripcion': tc.get('classname', ''),
            'resultado': 'FAIL' if failure is not None else 'PASS',
            'duracion_ms': int(float(tc.get('time', 0)) * 1000),
            'error': failure.text if failure is not None else None,
        })
except Exception:
    total, pasaron, fallaron = 0, 0, 0
    escenarios = []
with open('veredicto.json', 'w') as f:
    json.dump({
        'escenarios': escenarios,
        'resumen': {'total': total, 'pasaron': pasaron, 'fallaron': fallaron, 'cobertura': 'N/A'},
        'metadata': {
            'modelo': 'baidu/cobuddy',
            'timestamp': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
            'oraculo': 'casos_prueba.md',
            'duracion_total_ms': 0,
        }
    }, f, indent=2, ensure_ascii=False)
print(f'veredicto.json generado: {total} tests, {pasaron} pasaron, {fallaron} fallaron')
"

      - name: Upload veredicto.json
        uses: actions/upload-artifact@v4
        with:
          name: veredicto
          path: veredicto.json

      - name: Upload reporte JUnit
        uses: actions/upload-artifact@v4
        with:
          name: reporte-junit
          path: reporte_junit.xml
